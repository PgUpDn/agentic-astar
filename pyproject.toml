[project]
name = "agentic-astar"
version = "0.1.0"
description = "Multi-agent Discord simulation of A*STAR's organisational structure"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.4",
    "openai>=1.50",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
]

[project.scripts]
astar-sim = "astar_agents.main:main"

[tool.uv]
package = true
